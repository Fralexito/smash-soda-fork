<title>Phoenix Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Concepto: cabina de mando. Riel izquierdo + barra superior; el centro de Sala es un "enlace" visual entre dos jugadores con el ping como protagonista. */
:root{
  --bg:#05060f; --panel:rgba(13,18,42,.66); --panel-solid:#0b1030;
  --acc:#00e5ff; --acc2:#8000ff; --acc-soft:rgba(0,229,255,.12);
  --line:rgba(0,229,255,.22); --line-strong:rgba(0,229,255,.55);
  --fg:#e8f1ff; --mut:#93a4cc; --ok:#3ddc97; --warn:#ffb547; --bad:#ff5d73;
  --on-acc:#021018; --glow:0 0 22px rgba(0,229,255,.22);
  --f-disp:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
:root[data-tema='sudario']{
  --bg:#050a18; --panel:rgba(14,22,48,.66); --panel-solid:#0c1634;
  --acc:#f5c451; --acc2:#3b82f6; --acc-soft:rgba(245,196,81,.12);
  --line:rgba(245,196,81,.24); --line-strong:rgba(245,196,81,.6);
  --on-acc:#1a1203; --glow:0 0 22px rgba(245,196,81,.2);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);overflow:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.glow-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--acc2) 28%,transparent),transparent 70%),
  radial-gradient(700px 500px at 0% 110%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%)}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:92px 1fr;grid-template-rows:64px 1fr}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.tag{font:600 12px/1 var(--f-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.grad{background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* barra superior */
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(5,6,15,.55);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font:700 20px/1 var(--f-disp);letter-spacing:.2em}
.brand small{display:block;font:500 12px/1.2 var(--f-mono);color:var(--mut);letter-spacing:.08em;margin-top:3px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font:500 12px var(--f-mono);letter-spacing:.06em;background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
.dot.off{background:var(--mut);box-shadow:none;animation:none}
@keyframes pulse{50%{opacity:.4}}
.ghost{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;font:600 12px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;transition:transform .16s var(--ease),border-color .16s,background .16s}
.ghost:hover{border-color:var(--line-strong);background:var(--acc-soft)}
.ghost:active{transform:scale(.96)}

/* riel */
.rail{border-right:1px solid var(--line);background:rgba(5,6,15,.45);display:flex;flex-direction:column;gap:6px;padding:14px 8px;align-items:stretch}
.nav{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:0;border-radius:10px;background:transparent;cursor:pointer;color:var(--mut);transition:color .16s,background .16s,transform .16s var(--ease)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav span{font:600 12px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase}
.nav:hover{color:var(--fg);background:var(--acc-soft)}
.nav:active{transform:scale(.95)}
.nav[aria-selected=true]{color:var(--acc);background:linear-gradient(90deg,var(--acc-soft),transparent)}
.nav[aria-selected=true]::before{content:'';position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--acc),var(--acc2));box-shadow:var(--glow)}
.rail .foot{margin-top:auto;text-align:center;font:500 12px var(--f-mono);color:var(--mut)}

/* vistas */
main{min-width:0;overflow:auto;padding:20px 24px}
.view{display:none;gap:16px}
.view.on{display:grid;animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.panel{position:relative;min-width:0;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:12px;padding:16px;backdrop-filter:blur(12px)}
.panel h2{margin:0 0 12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.btn{height:40px;padding:0 18px;border:0;border-radius:10px;cursor:pointer;font:700 13px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--on-acc);background:linear-gradient(100deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--acc2)));transition:transform .16s var(--ease),box-shadow .16s}
.btn:hover{box-shadow:var(--glow)}
.btn:active{transform:scale(.96)}
.btn.alt{color:var(--fg);background:transparent;border:1px solid var(--line-strong)}

/* SALA */
.v-sala{grid-template-columns:repeat(12,1fr);grid-template-rows:auto minmax(190px,1fr) auto}
.v-sala.on{height:100%;min-height:560px}
.c-tel{display:flex;flex-direction:column}
.hero{grid-column:1/-1;padding:22px 24px;border-left-width:1px;background:linear-gradient(110deg,color-mix(in srgb,var(--acc) 9%,var(--panel-solid)),color-mix(in srgb,var(--acc2) 14%,var(--panel-solid)))}
.link{display:grid;grid-template-columns:1fr minmax(150px,1.2fr) 1fr;align-items:center;gap:18px}
.seat{display:flex;align-items:center;gap:14px;min-width:0}
.seat.r{flex-direction:row-reverse;text-align:right}
.avatar{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px var(--f-disp);border:2px solid var(--acc);box-shadow:var(--glow),inset 0 0 18px var(--acc-soft);background:var(--panel-solid)}
.seat.r .avatar{border-color:var(--acc2);box-shadow:0 0 22px color-mix(in srgb,var(--acc2) 40%,transparent)}
.seat.empty .avatar{border-style:dashed;border-color:var(--mut);box-shadow:none;color:var(--mut)}
.seat h3{margin:2px 0 0;font:700 18px/1.2 var(--f-disp);letter-spacing:.04em;overflow-wrap:anywhere}
.seat p{margin:2px 0 0;color:var(--mut);font-size:12px}
.wire{position:relative;text-align:center}
.wire svg{width:100%;height:46px;display:block;overflow:visible}
.wire .ms{font:700 34px/1 var(--f-disp);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.wire .ms small{font:500 12px var(--f-mono);color:var(--mut);margin-left:4px}
.wire .q{font:500 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase}
.q.good{color:var(--ok)} .q.mid{color:var(--warn)} .q.bad{color:var(--bad)}
.flow{stroke-dasharray:6 8;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.wire.off .flow{animation:none;opacity:.25}

.c-tel{grid-column:span 7} .c-room{grid-column:span 5} .c-spec{grid-column:span 5} .c-stats{grid-column:span 7}
.chartwrap{position:relative;flex:1;min-height:140px}
.chart{position:absolute;inset:0;width:100%;height:100%;display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.2)}
.stat b{display:block;font:600 22px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
.lock{display:inline-flex;gap:6px;align-items:center;font:500 12px var(--f-mono);color:var(--warn)}
.code{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.code output{flex:1;display:block;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:10px;font:500 22px var(--f-mono);letter-spacing:.3em;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
.info{margin:18px 0 0;display:grid;gap:0}
.info div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.info dt{color:var(--mut);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.info dd{margin:0;font-weight:500}
.spec{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:rgba(0,0,0,.2)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--acc2)}

/* PARTIDO */
.v-partido{grid-template-columns:1.4fr 1fr;align-content:start}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;text-align:center}
.score .team{font:700 20px var(--f-disp);letter-spacing:.06em;overflow-wrap:anywhere}
.score .num{font:700 64px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.clock{font:500 16px var(--f-mono);color:var(--acc);letter-spacing:.2em;text-align:center;margin-top:8px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.2)}
.steps .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);flex:none}
.steps .done .st{border-color:var(--ok);background:var(--ok)}
.steps .now .st{border-color:var(--acc);box-shadow:var(--glow)}
.steps small{display:block;color:var(--mut);font-size:12px}

/* MANDOS */
.v-mandos{grid-template-columns:1.2fr 1fr;align-content:start}
.pad{width:100%;max-width:460px;margin:0 auto;display:block}
.pad [data-btn]{fill:var(--panel-solid);stroke:var(--line-strong);stroke-width:2;cursor:pointer;transition:fill .08s,filter .08s}
.pad [data-btn].lit{fill:var(--acc);filter:drop-shadow(0 0 8px var(--acc))}
.pad .padbase{fill:var(--panel-solid);stroke:none}
.pad .body{fill:color-mix(in srgb,var(--acc2) 12%,var(--panel-solid));stroke:var(--line-strong);stroke-width:2}
.pad text{fill:var(--mut);font:600 12px var(--f-disp);pointer-events:none}
.slots{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.2)}
.slot .led{width:10px;height:10px;border-radius:50%;background:var(--mut)}
.slot.on .led{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.slot b{font:600 15px var(--f-disp);letter-spacing:.06em}
.slot small{display:block;color:var(--mut);font-size:12px}
.hint{color:var(--mut);font-size:12px;margin:10px 0 0;text-align:center}

/* COMUNIDAD */
.v-com{grid-template-columns:1.5fr 1fr;align-content:start}
table{width:100%;border-collapse:collapse}
th{font:600 12px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);text-align:left;padding:6px 8px}
td{padding:10px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n{font-family:var(--f-mono);color:var(--acc);width:36px}
.tw{overflow-x:auto}
.st-on{color:var(--ok)} .st-play{color:var(--warn)} .st-off{color:var(--mut)}
.feed{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.feed li{padding-left:14px;border-left:2px solid var(--acc2)}
.feed small{display:block;color:var(--mut);font-size:12px}

/* AJUSTES */
.v-aj{grid-template-columns:1fr 1fr;align-content:start}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt small{display:block;color:var(--mut);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font:600 12px var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);transition:background .16s,color .16s}
.seg button[aria-pressed=true]{background:linear-gradient(100deg,var(--acc),color-mix(in srgb,var(--acc) 50%,var(--acc2)));color:var(--on-acc)}
.sw{width:46px;height:26px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;position:relative;cursor:pointer;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:transform .2s var(--ease),background .2s}
.sw[aria-checked=true]{background:var(--acc-soft)}
.sw[aria-checked=true]::after{transform:translateX(20px);background:var(--acc);box-shadow:var(--glow)}
select{background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;padding:10px 16px;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel-solid);font-size:13px;transition:transform .25s var(--ease),opacity .25s;z-index:5;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:980px){
  .c-tel,.c-room,.c-spec,.c-stats{grid-column:1/-1}
  .v-partido,.v-mandos,.v-com,.v-aj{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:56px auto 1fr;height:auto;min-height:100%}
  .top{grid-column:1;padding:0 16px}
  .top .pill{display:none}
  .brand b{font-size:16px;letter-spacing:.14em;white-space:nowrap}
  .brand small{display:none}
  .v-sala{grid-template-rows:none}
  .chartwrap{flex:none;height:150px}
  .rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;overflow-x:auto}
  .nav{flex:1;min-width:64px;padding:8px 4px}
  .rail .foot{display:none}
  .nav[aria-selected=true]::before{left:10px;right:10px;top:auto;bottom:-6px;width:auto;height:3px;border-radius:3px}
  main{padding:16px;overflow:visible}
  .link{grid-template-columns:1fr}
  .seat.r{flex-direction:row;text-align:left}
  .stats{grid-template-columns:repeat(2,1fr)}
  .score .num{font-size:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v3: sub-pestañas, formularios, listas ===== */
main{padding:16px 24px 24px}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:thin}
.subtabs button{flex:none;height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;font:600 12px var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);transition:background .16s,color .16s,border-color .16s,transform .16s var(--ease)}
.subtabs button:hover{color:var(--fg);border-color:var(--line-strong)}
.subtabs button:active{transform:scale(.96)}
.subtabs button[aria-selected=true]{color:var(--on-acc);border-color:transparent;background:linear-gradient(100deg,var(--acc),color-mix(in srgb,var(--acc) 50%,var(--acc2)))}
.page{display:grid;gap:16px;align-content:start;animation:enter .3s var(--ease)}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.cols.wide{grid-template-columns:1.4fr 1fr}
.opt .lab{min-width:0}
.opt .lab small{max-width:46ch}
.opt>*:last-child{flex:none}
input.num{width:92px;height:36px;background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;color:var(--fg);font:500 14px var(--f-mono);text-align:right}
input.txt,textarea.txt{width:100%;min-width:0;background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:8px;padding:9px 12px;color:var(--fg);font:14px var(--f-body)}
textarea.txt{resize:vertical;min-height:72px}
.opt.stack{flex-direction:column;align-items:stretch}
.opt.stack>*:last-child{flex:1}
.sw[disabled],.dim{opacity:.4;pointer-events:none}
.row2{display:flex;gap:8px;align-items:center}
.copyrow{display:flex;gap:8px;width:min(320px,100%)}
.copyrow input{flex:1}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm,.ghost.sm{height:34px;padding:0 12px;font-size:12px}
.ghost.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.ghost[aria-pressed=true]{background:var(--acc-soft);border-color:var(--line-strong);color:var(--acc)}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.2);min-width:0}
.item.sel{border-color:var(--acc);background:var(--acc-soft)}
.item .grow{flex:1;min-width:0}
.item .grow b{font-weight:600;overflow-wrap:anywhere}
.item small{display:block;color:var(--mut);font-size:12px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap}
button.item{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line);font:600 12px var(--f-mono);color:var(--mut)}
.badge.acc{color:var(--acc);border-color:var(--line-strong)}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)} .badge.bad{color:var(--bad)}
.lock-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.lk{height:48px;border-radius:10px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);cursor:pointer;font:600 13px var(--f-disp);letter-spacing:.06em;transition:transform .12s var(--ease),background .16s}
.lk.on{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.lk:active{transform:scale(.94)}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.keygrid label{display:grid;gap:4px;font:600 12px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.keygrid select{width:100%}
.meter{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;width:100%}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .15s linear}
input[type=range]{accent-color:var(--acc);width:100%}
.audio{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.2)}
.audio .mt{width:36px;height:36px;border-radius:8px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);cursor:pointer;display:grid;place-items:center}
.audio .mt[aria-pressed=false]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.audio .mt svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.audio .ctl{display:grid;gap:8px;min-width:0}
.sec-t{margin:18px 0 6px;font:600 12px var(--f-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.sec-t:first-child{margin-top:0}
.note{color:var(--mut);font-size:12px;margin:0}
.warnbox{padding:10px 12px;border:1px solid var(--warn);border-radius:10px;color:var(--warn);font-size:13px;background:color-mix(in srgb,var(--warn) 8%,transparent)}
.chat-log{display:grid;gap:8px;align-content:start;overflow:auto;flex:1;padding:4px 2px}
.msg{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:13px;overflow-wrap:anywhere}
.msg b{color:var(--acc);font-weight:600}
.msg.bot b{color:var(--acc2)}
.logl{font:12px/1.5 var(--f-mono);overflow-wrap:anywhere}
.logl.n{color:var(--warn)} .logl.e{color:var(--bad)}

/* ---------- ping en vivo ---------- */
const ping=Array.from({length:60},(_,i)=>24+Math.sin(i/5)*4+Math.random()*4);
setInterval(()=>{
  if(!hosting){ping.push(NaN);ping.shift();drawChart();return}
  const last=ping.filter(x=>!isNaN(x)).slice(-1)[0]||24;
  const v=Math.max(14,Math.min(80,last+(Math.random()-.5)*9+(24-last)*.12));ping.push(v);ping.shift();
  const r=Math.round(v),ms=$('#msNow');if(ms){ms.textContent=r;const q=$('#qual');q.className='q '+(r<40?'good':r<60?'mid':'bad');q.textContent=r<40?'Enlace estable':r<60?'Enlace irregular':'Enlace inestable';const j=$('#sJit');if(j)j.textContent=Math.max(1,Math.round(Math.abs(v-last)))}
  drawChart();
  $$('[data-meter]').forEach(m=>{const on=C[m.dataset.meter];const l=on?Math.random()*(m.dataset.meter==='micOn'?.7:.9):0;m.style.width=(l*100)+'%';m.style.background=l<.45?'var(--ok)':l<.65?'var(--acc)':'var(--bad)'});
},1000);
function drawChart(){
  const c=$('#chart');if(!c||!c.offsetWidth)return;
  const d=devicePixelRatio||1,w=c.offsetWidth,hh=c.offsetHeight;c.width=w*d;c.height=hh*d;const x=c.getContext('2d');x.scale(d,d);
  const acc=css('--acc'),acc2=css('--acc2'),mut=css('--mut'),line=css('--line');

  const L=34,B=hh-6,T=8,max=80,Y=v=>T+(B-T)*(1-v/max);
  [0,40,80].forEach(v=>{x.beginPath();x.moveTo(L,Y(v));x.lineTo(w,Y(v));x.stroke();x.fillText(v,0,Y(v)+4)});
  x.setLineDash([4,4]);x.strokeStyle=css('--warn');x.beginPath();x.moveTo(L,Y(60));x.lineTo(w,Y(60));x.stroke();x.setLineDash([]);
  const pts=ping.map((v,i)=>[L+(w-L)*i/(ping.length-1),v]);
  const g=x.createLinearGradient(0,T,0,B);g.addColorStop(0,acc+'55');g.addColorStop(1,acc+'00');
  x.beginPath();let st=false;pts.forEach(([px,v])=>{if(isNaN(v)){st=false;return}st?x.lineTo(px,Y(v)):x.moveTo(px,Y(v));st=true});
  const gl=x.createLinearGradient(L,0,w,0);gl.addColorStop(0,acc2);gl.addColorStop(1,acc);x.strokeStyle=gl;x.lineWidth=2;x.stroke();
  const lp=pts.filter(p=>!isNaN(p[1])).slice(-1)[0];

}
