<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Phoenix Link — Mandos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
.root *{box-sizing:border-box}
.cut{padding:1px;background:linear-gradient(135deg,var(--acc),rgba(255,255,255,.05) 45%,var(--acc2));clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.cut>.in{background:var(--panelsolid);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));height:100%}
.nv{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;padding:12px 0;border-radius:12px;color:var(--mut);font:600 12px/1 'Chakra Petch',sans-serif;letter-spacing:.14em}
.nv.on{color:var(--acc);background:linear-gradient(180deg,var(--accsoft),transparent)}
.pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.03);font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--fg)}
.lab{font:600 12px/1 'Chakra Petch',sans-serif;letter-spacing:.2em;color:var(--mut)}
.tab{height:36px;padding:0 18px;display:flex;align-items:center;border-radius:18px;border:1px solid var(--line);font:600 12px/1 'Chakra Petch',sans-serif;letter-spacing:.14em;color:var(--mut)}
.tab.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn{height:36px;padding:0 16px;border-radius:9px;background:transparent;font:600 12px/1 'Chakra Petch',sans-serif;letter-spacing:.14em;cursor:pointer}
</style>
</helmet>
<div class="root" style="position:relative;width:1280px;height:760px;overflow:hidden;background:{{bg}};color:#e8f1ff;font-family:'IBM Plex Sans','Segoe UI',sans-serif;--bg:{{bg}};--panelsolid:{{panel}};--acc:{{acc}};--acc2:{{acc2}};--accsoft:{{accsoft}};--line:{{line}};--mut:#a3b3d9;--onacc:{{onacc}};--ok:#3ddc97;--warn:#ffb547;--bad:#ff6b80">
  <div style="position:absolute;inset:0;background:radial-gradient(900px 500px at 85% -10%,{{glow2}},transparent 60%),radial-gradient(800px 600px at 0% 110%,{{glow1}},transparent 60%)"></div>

  <div style="position:absolute;left:0;top:0;width:1280px;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(5,6,15,.55)">
    <div style="display:flex;align-items:center;gap:14px">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="var(--acc)" stroke-width="2" aria-label="Logo"><path d="M18 3l13 7.5v15L18 33 5 25.5v-15z"/><path d="M18 11c3 4 5 6 5 9a5 5 0 01-10 0c0-2 1-3 2-4 .5 2 1.5 2.500 2.500 2.500C17 15 17 13 18 11z" fill="var(--acc2)" stroke="none"/></svg>
      <div>
        <div style="font:700 22px/1 'Chakra Petch',sans-serif;letter-spacing:.2em;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent">PHOENIX LINK</div>
        <div style="margin-top:5px;font:500 12px/1 'IBM Plex Mono',monospace;color:var(--mut)">{{liga}}</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="pill"><span style="width:8px;height:8px;border-radius:4px;background:var(--ok);box-shadow:0 0 10px var(--ok)"></span>EN VIVO · 3 EN SALA</div>
      <div class="pill"><span style="width:8px;height:8px;border-radius:4px;background:var(--ok)"></span>WEB SYNC</div>
      <div class="pill" style="color:var(--acc);border-color:var(--acc)">{{themeName}}</div>
    </div>
  </div>

  <div style="position:absolute;left:0;top:64px;width:96px;height:696px;border-right:1px solid var(--line);background:rgba(5,6,15,.4);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:16px">
    <div class="nv"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></svg>SALA</div>
    <div class="nv"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 21V4h11l-2 4 2 4H6"/></svg>PARTIDO</div>
    <div class="nv on"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.500" y="7" width="19" height="10" rx="5"/><path d="M8 10v4M6 12h4M16 11h.01M18 13h.01"/></svg>MANDOS</div>
    <div class="nv"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.500"/><path d="M2.500 20c0-4 3-6 6.500-6s6.500 2 6.500 6M16 5a3.500 3.500 0 010 6.500M18 14c2.500.7 3.500 2.700 3.500 6"/></svg>GENTE</div>
    <div class="nv"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>AJUSTES</div>
    <div style="margin-top:auto;padding-bottom:14px;text-align:center;font:500 12px/1.4 'IBM Plex Mono',monospace;color:var(--mut)">DATOS DE<br>EJEMPLO</div>
  </div>

  <div style="position:absolute;left:96px;top:64px;width:1184px;height:696px;padding:22px 28px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;gap:10px">
        <div class="tab on">PUESTOS</div><div class="tab">TECLADO</div><div class="tab">TURNOS</div><div class="tab">MARIONETAS</div><div class="tab">BLOQUEO</div>
      </div>
      <div style="display:flex;align-items:baseline;gap:10px"><span style="font:700 34px/1 'Chakra Petch',sans-serif;color:var(--acc)">6</span><span style="font:500 14px/1 'IBM Plex Mono',monospace;color:var(--mut)">DE 8 MANDOS EN USO</span></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:16px;flex:1;min-height:0">
      <sc-for list="{{pads}}" as="p" hint-placeholder-count="8">
        <div class="cut"><div class="in" style="padding:18px 18px;display:flex;flex-direction:column;gap:8px;position:relative;background:{{p.fill}}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div style="font:700 60px/0.9 'Chakra Petch',sans-serif;letter-spacing:-.02em;color:{{p.numColor}}">{{p.n}}</div>
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{p.numColor}}" stroke-width="1.5" aria-label="Mando"><rect x="2.500" y="7" width="19" height="10" rx="5"/><path d="M8 10v4M6 12h4M16 11h.01M18 13h.01"/></svg>
          </div>
          <div style="margin-top:6px;font:600 18px/1.2 'IBM Plex Sans',sans-serif;color:{{p.nameColor}}">{{p.name}}</div>
          <div style="font:500 12px/1 'IBM Plex Mono',monospace;color:var(--mut)">{{p.sub}}</div>
          <div style="margin-top:auto;display:flex;gap:8px">
            <button class="btn" style="flex:1;border:1px solid {{p.btnColor}};color:{{p.btnColor}}">{{p.btn}}</button>
          </div>
        </div></div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["galaxy","sudario"],"default":"galaxy"},"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const TH = {
      galaxy: { bg:'#05060f', panel:'#0b1030', acc:'#00e5ff', acc2:'#8000ff', accsoft:'rgba(0,229,255,.14)', line:'rgba(0,229,255,.26)', onacc:'#021018', glow1:'rgba(0,229,255,.12)', glow2:'rgba(128,0,255,.22)', liga:'Galaxy League', themeName:'GALAXY' },
      sudario:{ bg:'#050a18', panel:'#0c1634', acc:'#f5c451', acc2:'#3b82f6', accsoft:'rgba(245,196,81,.14)', line:'rgba(245,196,81,.28)', onacc:'#1a1203', glow1:'rgba(245,196,81,.10)', glow2:'rgba(59,130,246,.22)', liga:'Liga Sudario', themeName:'SUDARIO' }
    };
    const t = TH[this.props.theme] || TH.galaxy;
    const used = (n, name, sub) => ({ n, name, sub, fill:'#0b1030', numColor:t.acc, nameColor:'#fff', btn:'QUITAR MANDO', btnColor:'#ff6b80' });
    const free = (n) => ({ n, name:'Mando libre', sub:'Sin asignar', fill:'#080b1f', numColor:'rgba(255,255,255,.22)', nameColor:'#a3b3d9', btn:'ASIGNAR', btnColor:t.acc });
    return Object.assign({}, t, {
      pads: [
        used('01','Jugador A','Parsec · XInput'),
        used('02','Jugador B','Parsec · XInput'),
        used('03','Jugador C','Teclado'),
        used('04','Anfitrión','Mando local'),
        used('05','Jugador D','Parsec · DirectInput'),
        used('06','Jugador E','Parsec · XInput'),
        free('07'),
        free('08')
      ]
    });
  }
}
</script>
</body>
</html>
